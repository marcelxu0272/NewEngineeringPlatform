<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>第三方人员管理</title>
  <link rel="stylesheet" href="https://unpkg.com/element-ui@2.15.14/lib/theme-chalk/index.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app" v-cloak>
    <aside class="side-nav">
      <a href="/" class="logo-link">W.</a>
      <div class="side-menu">
        <a href="/dashboard" class="side-item" title="项目中台">▦</a>
        <a href="/project-requirements" class="side-item" title="关键项目岗位需求">▤</a>
        <span class="side-item active" title="第三方人员管理">▣</span>
        <span class="side-item" title="设置">⚙</span>
      </div>
    </aside>

    <main class="main-layout">
      <header class="top-bar">
        <h2>第三方人员管理</h2>
        <div class="top-meta">待办(0)&nbsp;&nbsp;&nbsp;您好，admin</div>
      </header>

      <section class="content-area">
        <div class="action-row">
          <el-button type="primary" class="action-btn" icon="el-icon-plus" @click="openAdd">添加人员</el-button>
          <el-button type="primary" class="action-btn" icon="el-icon-download" @click="exportData">导出数据</el-button>
        </div>

        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-label">总人员数量</div>
            <div class="stat-value">{{ personnelList.length }}</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">合作公司数量</div>
            <div class="stat-value">{{ companyCount }}</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">涉及项目数量</div>
            <div class="stat-value">{{ projectCount }}</div>
          </div>
        </div>

        <div class="panel">
          <div class="filter-grid">
            <div>
              <label class="field-label">搜索姓名或公司</label>
              <el-input v-model="draftFilter.keyword" placeholder="输入姓名或公司名称"></el-input>
            </div>
            <div>
              <label class="field-label">所属项目</label>
              <el-select v-model="draftFilter.project" clearable placeholder="全部项目" style="width:100%">
                <el-option v-for="item in projectOptions" :key="item" :label="item" :value="item"></el-option>
              </el-select>
            </div>
            <div class="filter-actions">
              <el-button @click="resetFilter">重置</el-button>
              <el-button type="primary" class="primary-btn" @click="applyFilter">搜索</el-button>
            </div>
          </div>
        </div>

        <div class="panel table-panel">
          <el-table :data="pagedData" stripe>
            <el-table-column type="index" label="序号" width="72"></el-table-column>
            <el-table-column prop="companyName" label="公司名称" min-width="160"></el-table-column>
            <el-table-column prop="name" label="姓名" width="90"></el-table-column>
            <el-table-column prop="gender" label="性别" width="72"></el-table-column>
            <el-table-column prop="age" label="年龄" width="72"></el-table-column>
            <el-table-column prop="project" label="所属项目" min-width="120"></el-table-column>
            <el-table-column prop="arrivalDate" label="到岗时间" width="120"></el-table-column>
            <el-table-column prop="projectDuration" label="项目周期" width="120"></el-table-column>
            <el-table-column prop="weeklyWorkTime" label="周工作时间" width="120"></el-table-column>
            <el-table-column label="费率(基/工作日/周末/法假)" min-width="220">
              <template slot-scope="scope">
                {{ scope.row.baseRate }}/{{ scope.row.weekdayOvertimeRate }}/{{ scope.row.weekendOvertimeRate }}/{{ scope.row.holidayOvertimeRate }}
              </template>
            </el-table-column>
            <el-table-column label="人员状态" width="100">
              <template slot-scope="scope">
                <el-tag :type="scope.row.status === '在岗' ? 'success' : 'warning'" size="mini">{{ scope.row.status }}</el-tag>
              </template>
            </el-table-column>
            <el-table-column label="离岗时间" width="120">
              <template slot-scope="scope">{{ scope.row.leaveDate || '-' }}</template>
            </el-table-column>
            <el-table-column prop="phone" label="联系电话" width="130"></el-table-column>
            <el-table-column label="操作" fixed="right" width="220">
              <template slot-scope="scope">
                <el-button type="text" @click="openEdit(scope.row)">编辑</el-button>
                <el-button type="text" @click="openStatus(scope.row)">状态调整</el-button>
                <el-button type="text" class="danger-op" @click="deletePerson(scope.row.id)">删除</el-button>
              </template>
            </el-table-column>
          </el-table>
          <div class="pager-row">
            <div>共 {{ filteredData.length }} 条</div>
            <el-pagination
              background
              layout="prev, pager, next"
              :page-size="pageSize"
              :current-page.sync="currentPage"
              :total="filteredData.length"
            ></el-pagination>
          </div>
        </div>
      </section>
    </main>

    <el-dialog
      :title="dialogMode === 'create' ? '添加人员信息' : '编辑人员信息'"
      :visible.sync="showPersonDialog"
      width="1080px"
      :close-on-click-modal="false"
      custom-class="fixed-dialog"
      @open="lockBodyScroll"
      @closed="unlockBodyScroll"
    >
      <el-form ref="personFormRef" :model="personForm" :rules="personRules" label-position="top" class="person-el-form">
        <div class="form-grid">
          <el-form-item label="公司名称" prop="companyName">
            <el-autocomplete
              v-model.trim="personForm.companyName"
              :fetch-suggestions="queryCompanySuggestions"
              placeholder="请输入或选择公司名称"
              style="width:100%"
              @select="onCompanySelect"
            ></el-autocomplete>
          </el-form-item>
          <el-form-item label="姓名" prop="name">
            <el-input v-model.trim="personForm.name" placeholder="请输入姓名"></el-input>
          </el-form-item>
          <el-form-item label="性别" prop="gender">
            <el-select v-model="personForm.gender" placeholder="请选择" style="width:100%">
              <el-option label="男" value="男"></el-option>
              <el-option label="女" value="女"></el-option>
            </el-select>
          </el-form-item>
          <el-form-item label="年龄" prop="age">
            <el-input-number v-model="personForm.age" :min="18" :max="65" style="width:100%"></el-input-number>
          </el-form-item>
          <el-form-item label="所属项目" prop="project">
            <el-select v-model="personForm.project" placeholder="请选择" style="width:100%">
              <el-option v-for="item in projectOptions" :key="item" :label="item" :value="item"></el-option>
            </el-select>
          </el-form-item>
          <el-form-item label="实际到岗时间" prop="arrivalDate">
            <el-date-picker v-model="personForm.arrivalDate" type="date" value-format="yyyy-MM-dd" style="width:100%"></el-date-picker>
          </el-form-item>
          <el-form-item label="项目周期" prop="projectDuration">
            <el-input v-model.trim="personForm.projectDuration" placeholder="如：3个月、6个月"></el-input>
          </el-form-item>
          <el-form-item label="联系电话" prop="phone">
            <el-input v-model.trim="personForm.phone" maxlength="11" placeholder="请输入11位手机号"></el-input>
          </el-form-item>
          <el-form-item label="周工作时间（天*小时）" prop="weeklyWorkTime">
            <el-input v-model.trim="personForm.weeklyWorkTime" placeholder="如：5*8"></el-input>
          </el-form-item>
          <el-form-item label="基本费率（元/小时）" prop="baseRate">
            <el-input-number v-model="personForm.baseRate" :min="0.01" :precision="2" style="width:100%"></el-input-number>
          </el-form-item>
          <el-form-item label="工作日加班费率（元/小时）" prop="weekdayOvertimeRate">
            <el-input-number v-model="personForm.weekdayOvertimeRate" :min="0.01" :precision="2" style="width:100%"></el-input-number>
          </el-form-item>
          <el-form-item label="周末加班费率（元/小时）" prop="weekendOvertimeRate">
            <el-input-number v-model="personForm.weekendOvertimeRate" :min="0.01" :precision="2" style="width:100%"></el-input-number>
          </el-form-item>
          <el-form-item label="法定假日加班费率（元/小时）" prop="holidayOvertimeRate">
            <el-input-number v-model="personForm.holidayOvertimeRate" :min="0.01" :precision="2" style="width:100%"></el-input-number>
          </el-form-item>
        </div>
      </el-form>
      <span slot="footer">
        <el-button @click="showPersonDialog = false">取消</el-button>
        <el-button type="primary" class="primary-btn" @click="savePerson">保存</el-button>
      </span>
    </el-dialog>

    <el-dialog
      title="状态切换与离岗时间"
      :visible.sync="showStatusDialog"
      width="560px"
      :close-on-click-modal="false"
      custom-class="fixed-dialog"
      @open="lockBodyScroll"
      @closed="unlockBodyScroll"
    >
      <div class="status-form">
        <el-form ref="statusFormRef" :model="statusForm" :rules="statusRules" label-position="top">
          <el-form-item label="人员状态" prop="status">
            <el-select v-model="statusForm.status" style="width:100%" @change="onStatusChanged">
              <el-option label="在岗" value="在岗"></el-option>
              <el-option label="离岗" value="离岗"></el-option>
            </el-select>
          </el-form-item>
          <el-form-item label="离岗时间" prop="leaveDate">
            <el-date-picker
              v-model="statusForm.leaveDate"
              type="date"
              value-format="yyyy-MM-dd"
              style="width:100%"
              :disabled="statusForm.status !== '离岗'"
            ></el-date-picker>
          </el-form-item>
        </el-form>
      </div>
      <div class="status-log-section">
        <div class="field-label">状态调整记录</div>
        <el-table :data="statusLogsForDisplay" size="mini" stripe max-height="220" empty-text="暂无状态调整记录">
          <el-table-column prop="operator" label="操作人" width="100"></el-table-column>
          <el-table-column prop="operationTime" label="操作时间" width="170"></el-table-column>
          <el-table-column prop="content" label="操作内容" min-width="240"></el-table-column>
        </el-table>
      </div>
      <span slot="footer">
        <el-button @click="showStatusDialog = false">取消</el-button>
        <el-button type="primary" class="primary-btn" @click="saveStatus">保存</el-button>
      </span>
    </el-dialog>
  </div>

  <script src="https://unpkg.com/vue@2.7.16/dist/vue.js"></script>
  <script src="https://unpkg.com/element-ui@2.15.14/lib/index.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
