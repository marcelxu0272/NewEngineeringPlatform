window.DASHBOARD_THEMES = {
    teal: {primary:'#008b8b',primaryDark:'#00676b',primarySoft:'#e9f6f6',accent:'#20b9b4',secondary:'#629eea',warning:'#f39c39',warningSoft:'#fff6ea',danger:'#e94f68',dangerSoft:'#fff0f3',success:'#06997d',successSoft:'#eaf8f1',ink:'#183e57',muted:'#6e89a2',faint:'#9bb0c3',border:'#e2edf5',grid:'#e9f0f6',surface:'#ffffff',surfaceAlt:'#f6fafc',canvas:'#eef5f9',sidebar:'#174654',sidebarTop:'#237d85',sidebarText:'#cce6e8',shadow:'#c1d8e6',tooltip:'#163d50',tooltipText:'#ffffff',mask:'#173a52',track:'#e8f1f7',white:'#ffffff'},
    blue: {primary:'#306da9',primaryDark:'#234f80',primarySoft:'#eaf2fc',accent:'#52a7cb',secondary:'#7789d3',warning:'#d79a39',warningSoft:'#fff6e8',danger:'#df5c70',dangerSoft:'#fff0f3',success:'#238b77',successSoft:'#eaf7f0',ink:'#253d58',muted:'#6e839c',faint:'#a0b1c5',border:'#e2eaf5',grid:'#eaf0f7',surface:'#ffffff',surfaceAlt:'#f6f9fd',canvas:'#edf2f9',sidebar:'#203a5c',sidebarTop:'#386b9a',sidebarText:'#d1e1f3',shadow:'#c2d2e5',tooltip:'#233e60',tooltipText:'#ffffff',mask:'#213a5a',track:'#e7eef8',white:'#ffffff'},
    wood: {primary:'#897044',primaryDark:'#695334',primarySoft:'#f5f0e6',accent:'#b39769',secondary:'#729594',warning:'#cf8e43',warningSoft:'#fff5e7',danger:'#c7605b',dangerSoft:'#fcf0ee',success:'#508566',successSoft:'#eff6ed',ink:'#4d473b',muted:'#918879',faint:'#b1a895',border:'#e9e2d6',grid:'#eee8df',surface:'#fffefb',surfaceAlt:'#faf7f1',canvas:'#f2eee6',sidebar:'#454538',sidebarTop:'#807552',sidebarText:'#e4ddca',shadow:'#d9cdb6',tooltip:'#504836',tooltipText:'#fffefb',mask:'#514838',track:'#eee8dd',white:'#fffefb'}

Object.entries(window.DASHBOARD_THEMES.teal).forEach(([key,value])=>{

 document.documentElement.style.setProperty('--'+token,value);

});

  function render(){
    hideTooltip();model=buildModel();$('asofDate').textContent=`${state.year}-08-31`;
    renderKpis();renderCash();renderRisk();renderContribution();renderTargets();renderDelivery();renderAlerts();
    
    document.querySelectorAll('[data-contribution-dim]').forEach(b=>b.classList.toggle('active',b.dataset.contributionDim===state.dimension));
    document.querySelectorAll('[data-target-metric]').forEach(b=>b.classList.toggle('active',b.dataset.targetMetric===state.target));
    document.body.dataset.ready='true';window.dashboard={state,model,charts,THEMES,DEMO_DATA,METRICS};
  }
  function toast(message){$('toast').textContent=message;$('toast').classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('toast').classList.remove('show'),2600);}
  function showDialog(title,content,footer='数据为交互演示样例，金额单位：万元。'){
    hideTooltip();Object.values(charts).forEach(c=>c.tooltip.hide(0));$('dialogTitle').textContent=title;$('dialogContent').innerHTML=content;$('dialogFooter').textContent=footer;$('detailDialog').showModal();$('closeDialog').focus();
  }
  function table(headers,rows){return `<table class="detail-table"><thead><tr>${headers.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.length?rows.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}</tr>`).join(''):`<tr><td colspan="${headers.length}" class="empty-state">当前筛选范围内暂无记录</td></tr>`}</tbody></table>`;}
  function openKpi(key){const m=METRICS[key],v=model.totals[key],t=model.targets[key];showDialog(m.name+' · 指标明细',`<p class="dialog-description">${m.definition}</p><div class="dialog-stats"><div><span>累计完成</span><strong>${money(v)}</strong></div><div><span>年度目标</span><strong>${money(t)}</strong></div><div><span>目标达成率</span><strong>${pct(v/t*100)}</strong></div></div>`+table(['板块','完成金额','所选范围占比'],model.depRows.map(r=>[safe(r.name),money(v*r.contract/model.totals.contract),pct(r.contract/model.totals.contract*100)])));}
  function openCash(index=model.n-1){const i=index,prev=i?model.net[i-1]:null;showDialog(`${state.year}年${i+1}月 · 现金流明细`,`<p class="dialog-description">银行现金口径，包含经营、投资及筹资收支。流出以正数展示，净额按流入减流出计算。</p><div class="dialog-stats"><div><span>现金流入</span><strong>${money(model.inflow[i])}</strong></div><div><span>现金流出</span><strong>${money(model.outflow[i])}</strong></div><div><span>净现金流</span><strong>${money(model.net[i])}</strong></div></div>`+table(['月份','流入','流出','净额','年初至当月累计净额'],model.inflow.map((v,j)=>[`${j+1}月`,money(v),money(model.outflow[j]),money(model.net[j]),money(sum(model.net.slice(0,j+1)))])),`所选范围：${state.unit} / ${state.business}。点击图例可显隐系列；累计净额 = 各月净额之和。`);}
  function openAging(i=null){const names=['1年以内','1–2年','2–3年','3年以上'],weights=[.68,.22,.07,.03],values=splitExact(model.receivables,weights);showDialog(i===null?'应收账款 · 账龄结构':names[i]+' · 账龄明细',`<p class="dialog-description">账龄从应收账款形成之日计算。2年以上占比为10%，3年以上占比为3%。账龄较长不等同于合同已逾期。</p>`+table(['账龄','金额','占比'],names.map((n,j)=>[n,money(values[j]),pct(weights[j]*100,0)]))+`<p class="dialog-total">合计 <strong>${money(model.receivables)}</strong> 万元 / 100%</p>`);}
  function openDepartment(name){let row=dimensionRows().find(r=>r.name===name)||model.depRows.find(r=>r.name===name);if(!row)return;showDialog(name+' · 经营贡献',`<p class="dialog-description">合同额、回款额为年初至截止日累计；净现金贡献为同期现金流入减流出分配至该维度的演示金额。</p>`+table(['指标','金额 / 比例'],[['新签合同额',money(row.contract)+' 万元'],['完成回款额',money(row.receipt)+' 万元'],['完成开票额',money(row.invoice)+' 万元'],['净现金贡献',money(row.net)+' 万元'],['合同额占比',pct(row.contract/model.totals.contract*100)],['合同目标达成率',pct(row.rate)]]));}
  function openProjects(status=null){let rows=model.projects.filter(p=>!status||p.status===status);showDialog((status?status+'项目':'项目交付')+' · 清单',table(['项目名称','负责板块','状态','交付节点','计划日期'],rows.map(p=>[safe(p.name),p.department,p.status,p.milestone,p.due.replace('2026',String(state.year))])),'演示项目状态与环图、图例数量一致；风险项目与逾期项目分别统计，风险不等于逾期。');}
  function openLoad(i,annual,monthly){showDialog(`${state.year}年${model.n-5+i}月 · 生产负荷率`,`<p class="dialog-description">年度负荷率 = 已排定年度工时 ÷ 年度可用工时；当月负荷率 = 当月已排定工时 ÷ 当月可用工时。两条曲线采用不同时间口径。</p>`+table(['月份','年度负荷率','当月负荷率'],annual.map((v,j)=>[`${model.n-5+j}月`,pct(v,2),pct(monthly[j],2)])));}
  function setUnit(name){state.unit=name;$('unitSelect').value=name;render();toast('已筛选：'+name);}
  function help(){showDialog('看板使用说明',`<div class="help-grid"><div><h3>筛选与联动</h3><p>切换年度、板块和业务类型，经营金额、现金流、贡献表、账龄及项目清单同步更新。重置按钮恢复默认范围。</p></div><div><h3>图表探索</h3><p>悬停查看精确数值；点击现金流、账龄、目标达成和交付环图查看明细。现金流与负荷图的图例支持显隐。</p></div><div><h3>模块区分</h3><p>经营贡献分析展示金额与贡献来源；板块目标达成展示年度计划完成进度。两个模块分别支持归因和目标管理。</p></div><div><h3>统一主题</h3><p>右上角可即时切换青绿、深蓝、暖棕主题。界面、图表、提示和弹窗同步换色。</p></div></div><p class="dialog-description">原图为AI生成，原型已重建中文文字，并统一金额、百分比、账龄、项目状态和累计口径。所有业务数据均为演示样例，未连接真实系统。</p>`,'数据时间：2026年样例截至8月31日；2025年对比样例截至8月31日。');}
  function showTooltip(el){if($('detailDialog').open)return;tooltipOwner=el;const tip=$('globalTooltip');tip.textContent=el.dataset.tip;tip.classList.add('show');tip.setAttribute('aria-hidden','false');el.setAttribute('aria-describedby','globalTooltip');positionTooltip(el);}
  function positionTooltip(el){const tip=$('globalTooltip'),r=el.getBoundingClientRect(),w=tip.offsetWidth,h=tip.offsetHeight;let x=Math.max(8,Math.min(innerWidth-w-8,r.left+r.width/2-w/2)),y=r.bottom+8;if(y+h>innerHeight-8)y=Math.max(8,r.top-h-8);tip.style.left=x+'px';tip.style.top=y+'px';}
  function hideTooltip(){if(tooltipOwner)tooltipOwner.removeAttribute('aria-describedby');tooltipOwner=null;$('globalTooltip').classList.remove('show');$('globalTooltip').setAttribute('aria-hidden','true');}
  document.addEventListener('pointerover',e=>{const el=e.target.closest('[data-tip]');if(el&&el!==tooltipOwner)showTooltip(el);});
  document.addEventListener('pointerout',e=>{if(tooltipOwner&&!tooltipOwner.contains(e.relatedTarget))hideTooltip();});
  document.addEventListener('focusin',e=>{const el=e.target.closest('[data-tip]');if(el)showTooltip(el);});
  document.addEventListener('focusout',hideTooltip);
  document.addEventListener('click',e=>{
    const b=e.target.closest('button,[data-kpi],[data-row]');if(!b)return;
    if(b.dataset.kpi)openKpi(b.dataset.kpi);
    
    else if(b.dataset.contributionDim){state.dimension=b.dataset.contributionDim;render();}
    else if(b.dataset.targetMetric){state.target=b.dataset.targetMetric;render();}
    else if(b.dataset.cashDetail!==undefined)openCash();
    else if(b.dataset.risk!==undefined){const i=+b.dataset.risk;if(i===0||i===3)openAging();else showDialog(['应收账款','WIP','存货'][i]+' · 指标说明',`<p class="dialog-description">${b.dataset.tip}</p><div class="dialog-stats"><div><span>当前金额</span><strong>${money([model.receivables,model.wip,model.inventory][i])}</strong></div></div>`);}
    else if(b.dataset.aging!==undefined)openAging(+b.dataset.aging);
    else if(b.dataset.row)openDepartment(b.dataset.row);
    else if(b.dataset.unit)setUnit(b.dataset.unit);
    else if(b.dataset.projectStatus)openProjects(b.dataset.projectStatus);
    else if(b.dataset.delivery!==undefined){const i=+b.dataset.delivery;if(i<2)openLoad(5,model.loadAnnual,model.loadMonthly);else openProjects(i===2?'逾期':'风险');}
    else if(b.dataset.alert!==undefined){const a=alerts()[+b.dataset.alert];showDialog(a.title,`<p class="dialog-description">${a.explain}</p><p>当前范围：${state.unit} / ${state.business}</p><button class="dialog-action" data-alert-action="${a.action}">查看相关明细 ${icon('chevron')}</button>`);}
    else if(b.dataset.alertAction){$('detailDialog').close();const a=b.dataset.alertAction;if(a==='receipt')openKpi('receipt');else if(a==='aging')openAging();else if(a==='cash')openCash();else openProjects('风险');}
    else if(b.id==='moreAlerts')showDialog('经营异常预警 · 当前范围',table(['预警','说明','日期'],alerts().map(a=>[a.title,a.detail,a.date])));
    else if(b.id==='helpButton')help();
    else if(b.id==='closeDialog')$('detailDialog').close();
    else if(b.id==='resetButton'){Object.assign(state,{year:2026,unit:'全部板块',business:'全部业务类型',dimension:'department',target:'contract'});$('yearSelect').value='2026';$('unitSelect').value=state.unit;$('businessSelect').value=state.business;render();document.querySelectorAll('.nav-button').forEach(b=>b.classList.toggle('active',b.dataset.focus==='overview'));toast('已恢复默认筛选与视图');}
    else if(b.dataset.focus){document.querySelectorAll('.nav-button').forEach(x=>x.classList.toggle('active',x===b));const id={overview:'kpiGrid',cash:'cashPanel',risk:'riskPanel',contribution:'contributionPanel',delivery:'deliveryPanel'}[b.dataset.focus],panel=$(id);if(panel){panel.classList.remove('focus-highlight');void panel.offsetWidth;panel.classList.add('focus-highlight');setTimeout(()=>panel.classList.remove('focus-highlight'),1800);}toast(b.dataset.focus==='overview'?'当前为公司运营总览':'已定位：'+b.textContent.trim());}
  });
  document.addEventListener('keydown',e=>{if(e.key==='Escape')hideTooltip();if(['Enter',' '].includes(e.key)&&e.target.matches('[data-kpi],[data-row]')){e.preventDefault();e.target.click();}});
  for(const [id,key] of [['yearSelect','year'],['unitSelect','unit'],['businessSelect','business']])$(id).addEventListener('change',e=>{state[key]=key==='year'?+e.target.value:e.target.value;render();});
  $('themeSelect').addEventListener('change',e=>{setTheme(e.target.value);toast('主题已切换');});
  $('detailDialog').addEventListener('click',e=>{if(e.target===$('detailDialog')){const r=e.target.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)e.target.close();}});
  window.addEventListener('resize',()=>{hideTooltip();clearTimeout(window.resizeTimer);window.resizeTimer=setTimeout(()=>Object.values(charts).forEach(c=>c.reflow()),80);});
  $('themeSelect').innerHTML=Object.keys(THEMES).map(k=>`<option value="${safe(k)}">${({teal:'青绿',blue:'深蓝',wood:'暖棕'})[k]||safe(k)}主题</option>`).join('');
  setTheme('teal');render();
})();

</script>
</body>
</html>
