<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>运营看板202610版</title>
<link rel="stylesheet" href="project-details.css">


<link rel="stylesheet" href="./overview/styles.css">
</head>
<body>
<svg class="svg-sprite" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"><defs>
<symbol id="icon-chart" viewBox="0 0 24 24"><path d="M4 20V12h4v8M10 20V8h4v12M16 20V4h4v16M3 4l5 3 5-4 7-1"/></symbol>
<symbol id="icon-document" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 7h6M9 11h6M9 15h4"/></symbol>
<symbol id="icon-invoice" viewBox="0 0 24 24"><path d="M5 3h14v17l-3-2-4 2-4-2-3 2zM8 7h8M8 11h5"/><circle cx="16" cy="15" r="3"/><path d="m14.7 15 1 1 1.8-2"/></symbol>
<symbol id="icon-money" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m8 7 4 5 4-5M8 12h8M8 15h8M12 12v6"/></symbol>
<symbol id="icon-shield" viewBox="0 0 24 24"><path d="M12 3 4 6v6c0 5 8 9 8 9s8-4 8-9V6zM8 11l3 3 5-6"/></symbol>
<symbol id="icon-briefcase" viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V4h8v3M3 12h18M10 12v3h4v-3"/></symbol>
<symbol id="icon-users" viewBox="0 0 24 24"><circle cx="9" cy="7" r="3"/><path d="M3 20v-5a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v5M16 4a3 3 0 0 1 0 6M18 12a4 4 0 0 1 3 4v4"/></symbol>
<symbol id="icon-settings" viewBox="0 0 24 24"><path d="m9 3-1 3-3 1v4l-2 1 2 3 3-1 2 3 1 4h3l1-4 2-3 3 1 2-3-2-1V7l-3-1-1-3z"/><circle cx="12" cy="11" r="3"/></symbol>
<symbol id="icon-chevron" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
<symbol id="icon-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7h.01"/></symbol>
<symbol id="icon-warning" viewBox="0 0 24 24"><path d="m12 3 10 18H2zM12 9v5M12 17h.01"/></symbol>
<symbol id="icon-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 6v6l4 2"/></symbol>
<symbol id="icon-refresh" viewBox="0 0 24 24"><path d="M20 8a8 8 0 0 0-14-3L3 8m0-5v5h5M4 16a8 8 0 0 0 14 3l3-3m0 5v-5h-5"/></symbol>
<symbol id="icon-palette" viewBox="0 0 24 24"><path d="M12 3a9 9 0 0 0 0 18h2a2 2 0 0 0 1-4c-2-1-1-3 1-3h2a4 4 0 0 0 3-4 9 9 0 0 0-9-7z"/><circle cx="7" cy="10" r=".5"/><circle cx="10" cy="6" r=".5"/><circle cx="15" cy="7" r=".5"/></symbol>
<symbol id="icon-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
<symbol id="icon-arrow" viewBox="0 0 24 24"><path d="M12 19V5m-5 5 5-5 5 5"/></symbol>
</defs></svg>
<div class="app">
 <aside class="sidebar" aria-label="看板导航">
  <div class="brand" data-tip="Wood · 公司运营看板">W</div>
  <nav class="nav">
   <button class="nav-button active" data-focus="overview" data-tip="运营看板：查看公司经营全景" aria-label="运营看板"><svg><use href="#icon-chart"/></svg><span>运营看板</span></button>
   <button class="nav-button" data-focus="cash" data-tip="资金状况：聚焦现金流与资金安全" aria-label="资金状况"><svg><use href="#icon-money"/></svg><span>资金状况</span></button>
   <button class="nav-button" data-focus="risk" data-tip="资金风险：查看应收账款、WIP、存货与营业收入" aria-label="资金风险"><svg><use href="#icon-shield"/></svg><span>资金风险</span></button>
   <button class="nav-button" data-focus="contribution" data-tip="板块现金流贡献：按板块查看净现金流贡献（正绿负红）" aria-label="板块现金流贡献"><svg><use href="#icon-briefcase"/></svg><span>现金流贡献</span></button>
   <button class="nav-button" data-focus="delivery" data-tip="工作负荷与交付保障：查看负荷率趋势和项目交付保障活动" aria-label="工作负荷与交付保障"><svg><use href="#icon-users"/></svg><span>交付保障</span></button>
  </nav>
  <div class="sidebar-bottom"><button class="icon-button" data-tip="单页经营全景 · 所有模块始终可见" aria-label="单页经营全景"><svg><use href="#icon-chevron"/></svg></button></div>
 </aside>
 <header class="header">
  <div class="header-title" hidden aria-hidden="true"><h1>运营看板202610版</h1></div>
  <div class="header-controls" hidden aria-hidden="true"><!-- 壳级筛选上提：年度/板块由 Board 注入；业务类型废除 --></div>
 </header>
 <main id="main">
  <div id="kpiToolbar" class="kpi-toolbar"><button type="button" id="kpiSubgoalSwitch" class="kpi-switch" role="switch" aria-checked="false"><span class="kpi-switch-track" aria-hidden="true"><span class="kpi-switch-thumb"></span></span><span class="kpi-switch-label">显示子目标</span></button><span class="kpi-toolbar-note">子目标拆分权重仅演示、非业务默认</span></div>
  <section id="kpiGrid" class="kpi-grid" aria-label="年度经营关键指标"></section>
  <section id="cashPanel" class="panel">
    <div class="panel-head"><h2 class="panel-title"><svg><use href="#icon-money"/></svg>现金流与资金安全<span class="unit">（万元）</span><button class="info-button" aria-label="现金流说明" data-tip="现金流入为实际到账；现金流出为实际支付；净现金流＝流入－流出。柱为当月流入/流出；折线为当年累计净现金流。">?</button></h2></div>
    <div id="cashMetrics" class="cash-metrics" aria-label="现金流三项指标"></div>
    <div class="chart-section-title"><span class="sub-title">当年现金流趋势<span class="unit">（万元）</span></span><button class="info-button" data-tip="柱：当月流入/当月流出；折线：当年累计净现金流（正绿负红）。悬停查看数值；点击图例显隐系列；点击柱或折线节点查看当月明细。" aria-label="现金流图表交互">?</button></div>
    <div class="cash-chart-wrap"><div id="cashChart" class="chart" aria-label="当年现金流趋势图"></div></div>
   </section>
  <section id="riskPanel" class="panel">
    <div class="panel-head"><h2 class="panel-title"><svg><use href="#icon-shield"/></svg>应收与资金风险<span class="unit">（万元）</span><button class="info-button" aria-label="资金风险口径" data-tip="应收账款为客户应收余额；WIP为已开展尚未结算确认的工作量；营业收入为当期经营收入（demo 占位，较上期对比）。">?</button></h2></div>
    <div id="riskMetrics" class="risk-metrics"></div>
   </section>
  <div id="pairRow" class="pair-row" role="group" aria-label="贡献与目标" data-testid="pair-row">
   <section id="contributionPanel" class="panel">
    <div class="panel-head contribution-head"><h2 class="panel-title"><svg><use href="#icon-briefcase"/></svg>板块现金流贡献<span class="unit">（万元）</span><button class="info-button" data-tip="按板块展示净现金流贡献：正值绿色、负值红色，按贡献值排序。仅展示现金流单一指标。点击柱条可查看板块明细。" aria-label="板块现金流贡献说明">?</button></h2></div>
    <div id="contributionChart" class="chart contribution-chart" aria-label="板块现金流贡献横向柱图"></div>
   </section>
   <section id="targetPanel" class="panel">
    <div class="panel-head target-head"><h2 class="panel-title"><svg><use href="#icon-chart"/></svg>板块目标达成<button class="info-button" data-tip="比较各板块实际值与对应年度目标。四个页签对齐顶部 KPI（新签合同额 / 完成合同额 / 完成开票额 / 完成回款额）；切换仅影响本区图表。" aria-label="板块目标达成说明">?</button></h2><div class="segment"><button class="active" data-target-metric="contract">新签合同额</button><button data-target-metric="completed">完成合同额</button><button data-target-metric="invoice">完成开票额</button><button data-target-metric="receipt">完成回款额</button></div></div>
    <div id="targetChart" class="chart target-chart" aria-label="板块目标达成图"></div><p id="targetNote" class="panel-note"></p>
   </section>
  </div>
  <section id="deliveryPanel" class="panel">
    <div class="panel-head"><h2 class="panel-title"><svg><use href="#icon-shield"/></svg>工作负荷与交付保障<button class="info-button" data-tip="年度和当月负荷率按排产工时／可用工时计算；项目交付保障活动展示正常、风险、逾期项目的分布。" aria-label="交付保障说明">?</button></h2></div>
    <div class="delivery-layout">
      <div class="delivery-left">
        <div class="delivery-kpi-row">
          <div class="delivery-kpi-card"><span class="metric-label">当月负荷率</span><strong id="monthlyLoadVal"></strong><small id="monthlyLoadSub"></small></div>
          <div class="delivery-kpi-card"><span class="metric-label">年度负荷率</span><strong id="annualLoadVal"></strong><small id="annualLoadSub"></small></div>
        </div>
      </div>
      <div class="delivery-mid">
        <div class="delivery-trend"><div class="chart-section-title"><span class="sub-title">近6个月负荷率趋势</span><button class="info-button" data-tip="悬停查看负荷率；点击图例切换系列；点击节点查看当月产能数据。" aria-label="负荷趋势交互">?</button></div><div id="loadChart" class="chart" aria-label="负荷率趋势图"></div></div>
      </div>
      <div class="delivery-right">
        <div class="delivery-status"><div class="chart-section-title"><span class="sub-title">项目交付保障活动</span><button class="info-button" data-tip="正常、风险、逾期项目互斥。中心显示在管项目总数；点击扇区或图例查看清单。" aria-label="交付状态说明">?</button></div><div class="delivery-chart-inner"><div class="donut-wrap"><div id="deliveryChart" class="chart" aria-label="项目交付保障活动环图"></div><div id="deliveryCenter" class="donut-center"></div></div><div id="deliveryLegend" class="legend-list"></div></div></div>
      </div>
    </div>
   </section>
  <section id="alertPanel" class="panel">
    <div class="panel-head alert-head"><h2 class="panel-title"><svg><use href="#icon-warning"/></svg>经营异常预警<button class="info-button" data-tip="根据回款进度、现金流波动和项目延期触发预警。点击预警查看触发原因及处置建议。" aria-label="预警说明">?</button></h2><button id="moreAlerts" class="text-button" data-tip="查看当前筛选范围的全部演示预警">更多<svg><use href="#icon-chevron"/></svg></button></div><div id="alertList" class="alert-list"></div>
   </section>
  <footer class="footer"><span><i class="status-dot"></i>演示原型 · 数据为模拟数据 · 金额单位：万元</span><span>统一统计口径 · 全局筛选联动 · 点击数据查看详情</span></footer>
 </main>
</div>
<dialog id="detailDialog" aria-labelledby="dialogTitle"><div class="dialog-head"><h2 id="dialogTitle">数据详情</h2><button id="closeDialog" class="icon-button" aria-label="关闭详情"><svg><use href="#icon-close"/></svg></button></div><div id="dialogContent" class="dialog-content"></div><div id="dialogFooter" class="dialog-footer"></div></dialog>
<div id="globalTooltip" class="global-tooltip" role="tooltip"></div><div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="./vendor/highcharts-12.4.0.min.js"></script>
<script src="kpi-subgoals.js"></script>
<script src="project-details.js"></script>

<script type="module" src="./overview/app.js"></script>
</body>
</html>
